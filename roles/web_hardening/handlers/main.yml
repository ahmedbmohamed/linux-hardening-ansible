---
- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when: web_hardening_manage_services | bool

- name: Reload apache
  ansible.builtin.systemd_service:
    name: "{{ web_hardening_apache_service }}"
    state: reloaded
  when: web_hardening_manage_services | bool
