---
- name: Create admin user in the sudo group
  ansible.builtin.user:
    name: "{{ hardening_admin_user }}"
    groups: "{{ hardening_sudo_group }}"
    append: true
    shell: /bin/bash
    create_home: true
  when: hardening_admin_pubkey | length > 0

- name: Create the admin user's .ssh folder
  ansible.builtin.file:
    path: "/home/{{ hardening_admin_user }}/.ssh"
    state: directory
    owner: "{{ hardening_admin_user }}"
    group: "{{ hardening_admin_user }}"
    mode: "0700"
  when: hardening_admin_pubkey | length > 0

- name: Install the admin user's public key
  ansible.builtin.lineinfile:
    path: "/home/{{ hardening_admin_user }}/.ssh/authorized_keys"
    line: "{{ hardening_admin_pubkey }}"
    create: true
    owner: "{{ hardening_admin_user }}"
    group: "{{ hardening_admin_user }}"
    mode: "0600"
  when: hardening_admin_pubkey | length > 0
