---
- name: Install Fail2ban
  ansible.builtin.package:
    name: "{{ hardening_fail2ban_packages }}"
    state: present

- name: Fail2ban jail for SSH
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Start and enable Fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  when: hardening_manage_services | bool
