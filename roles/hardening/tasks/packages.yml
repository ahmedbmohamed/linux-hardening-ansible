---
- name: Import the EPEL signing key (RHEL)
  ansible.builtin.rpm_key:
    key: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts['distribution_major_version'] }}
    state: present
  when: ansible_facts['distribution'] == 'RedHat'

- name: Enable EPEL (needed for Fail2ban and Lynis)
  ansible.builtin.dnf:
    name: "{{ 'https://dl.fedoraproject.org/pub/epel/epel-release-latest-' ~ ansible_facts['distribution_major_version'] ~ '.noarch.rpm' if ansible_facts['distribution'] == 'RedHat' else 'epel-release' }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Install base security packages
  ansible.builtin.package:
    name: "{{ hardening_base_packages }}"
    state: present

- name: Remove legacy insecure packages
  ansible.builtin.package:
    name: "{{ hardening_remove_packages }}"
    state: absent
